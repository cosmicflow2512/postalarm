name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # wöchentlich neu bauen, zieht aktuelles RSSHub-Image
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: sh -n start.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SMOKE_TAG: postalarm:smoke
      HARDEN: >-
        --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID
        --cap-add DAC_OVERRIDE --cap-add FOWNER
        --security-opt no-new-privileges=true --memory=1g --pids-limit=512
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Erst lokal bauen und das fertige Image prüfen, bevor etwas veröffentlicht wird.
      - name: Build smoke-test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.SMOKE_TAG }}

      - name: Unit tests with the image's Python
        run: |
          docker run --rm --entrypoint python3 -v "$PWD:/src:ro" -w /src "$SMOKE_TAG" \
            -m unittest discover -s tests -v

      - name: Self-test (DCE, CA, SQLite) as PUID/PGID with dropped capabilities
        run: |
          data="$(mktemp -d)"
          sudo chown 1234:1234 "$data" && sudo chmod 0700 "$data"
          docker run --rm $HARDEN -v "$data:/data" --entrypoint /opt/postalarm/start.sh "$SMOKE_TAG" 2>&1 \
            | tee boot.log || true
          # start.sh ohne Quelle -> Konfigurationsfehler, aber erst nach Benutzerwechsel
          grep -q 'Konfigurationsfehler' boot.log
          test "$(sudo stat -c '%u:%g' "$data")" = "99:100"
          docker run --rm $HARDEN -e HOME=/tmp -v "$data:/data" --entrypoint setpriv "$SMOKE_TAG" \
            --reuid=99 --regid=100 --clear-groups python3 /opt/postalarm/postalarm.py --self-test 2>&1 | tee self-test.log
          grep -q 'uid=99 gid=100' self-test.log

      - name: RSSHub + postalarm start as non-root and stop cleanly
        run: |
          docker run -d --name smoke $HARDEN -v "$(mktemp -d):/data" \
            -e X_ACCOUNTS=example -e TWITTER_AUTH_TOKEN=dummy \
            -e PUSHOVER_TOKEN=dummytoken -e PUSHOVER_USER=dummyuser "$SMOKE_TAG"
          for i in $(seq 1 150); do
            docker logs smoke 2>&1 | grep -q 'X: @example' && break
            sleep 2
          done
          docker logs smoke 2>&1 | tail -n 40
          docker logs smoke 2>&1 | grep -q 'RSSHub läuft'
          docker logs smoke 2>&1 | grep -q 'X: @example'
          docker exec smoke ps -eo user:12,args | tee ps.log
          if grep -E '^root .*(node|postalarm.py)' ps.log; then echo 'läuft als root'; exit 1; fi
          # Zugangsdaten nicht im falschen Prozess
          app="$(docker exec smoke pgrep -f postalarm.py | head -n1)"
          docker exec -u 99:100 smoke test -r /proc/$app/environ
          if docker exec -u 99:100 smoke sh -c "tr '\0' '\n' < /proc/$app/environ" | grep -q '^TWITTER_AUTH_TOKEN='; then
            echo 'postalarm sieht TWITTER_AUTH_TOKEN'; exit 1
          fi
          # RSSHub ohne Schlüssel nicht abrufbar
          code="$(docker exec smoke curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1200/twitter/user/example)"
          echo "ohne Key: HTTP $code"; test "$code" != "200"
          docker stop -t 30 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = "0"

      # CI-Logs sind nicht überall abrufbar; bei Fehlern die Log-Enden als Annotations ausgeben.
      - name: Diagnostics on failure
        if: failure()
        run: |
          for f in boot.log self-test.log ps.log; do
            [ -f "$f" ] && tail -n 15 "$f" | sed "s/^/::error title=$f::/"
          done
          docker logs smoke 2>&1 | tail -n 25 | sed 's/^/::error title=smoke::/' || true
          true

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
